name: apply v0.1.6 core hardening v4

on:
  push:
    paths:
      - .github/workflows/apply-v016-core-hardening-v4.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Correct and tune temporary patch generator
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          p = Path('scripts/apply-v016-core-hardening.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              "text, count = re.subn(pattern, repl, text, count=1, flags=flags)",
              "text, count = re.subn(pattern, lambda _match: repl, text, count=1, flags=flags)",
              1,
          )
          start = s.index("text = replace_once(text, \"$marker = Join-Path $InstallDir '.install-marker'\\n\", '', 'remove duplicate installer marker')")
          end_marker = "path.write_text(text, encoding='utf-8')\n\npath = Path('Uninstall.ps1')"
          end = s.index(end_marker, start)
          replacement = '''text = text.replace("$marker = Join-Path $InstallDir '.install-marker'\\n", "")
          text = text.replace("$InstallDir = [IO.Path]::GetFullPath($InstallDir)\\n", "$InstallDir = [IO.Path]::GetFullPath($InstallDir)\\n$marker = Join-Path $InstallDir '.install-marker'\\n", 1)
          '''
          s = s[:start] + replacement + s[end:]
          s = s.replace("Replace('\\\\\\\\', '/')", "Replace('\\\\', '/')")
          s = s.replace('"Local\\\\\\\\CodexSessionHealthHUD.Renderer."', '"Local\\\\CodexSessionHealthHUD.Renderer."')
          s = s.replace('request.Timeout = 2000;', 'request.Timeout = 1000;')
          s = s.replace('request.ReadWriteTimeout = 2000;', 'request.ReadWriteTimeout = 1000;')
          s = s.replace('internal const int EndpointFailureExitThreshold = 12;', 'internal const int EndpointFailureExitThreshold = 8;')
          s = s.replace("if (-not $hud.WaitForExit(14000))", "if (-not $hud.WaitForExit(18000))")
          p.write_text(s, encoding='utf-8')
          '@ | Set-Content -LiteralPath "$env:RUNNER_TEMP\fix-patch.py" -Encoding utf8
          python "$env:RUNNER_TEMP\fix-patch.py"

      - name: Apply core hardening patch
        shell: pwsh
        run: python .\scripts\apply-v016-core-hardening.py

      - name: Check renderer syntax
        shell: pwsh
        run: node --check .\RendererHudScript.js

      - name: Test renderer logic
        shell: pwsh
        run: node .\tests\renderer-logic.test.js

      - name: Build and run self-tests
        shell: pwsh
        run: .\Build.ps1

      - name: Test host lifecycle
        shell: pwsh
        run: .\tests\host-lifecycle.test.ps1

      - name: Test install safety
        shell: pwsh
        run: .\tests\install-safety.test.ps1

      - name: Create Windows package
        shell: pwsh
        run: .\Package.ps1 -OutputDir .\dist

      - name: Test Windows package
        shell: pwsh
        run: .\tests\package-layout.test.ps1 -PackagePath .\dist\CodexSessionHealthHUD-win-x64.zip

      - name: Verify diff
        shell: pwsh
        run: |
          git diff --check
          git status --short
          git diff -- CodexSessionHealthHUD.cs RendererHudBridge.cs HudStateStore.cs Launch-CodexWithSessionHealthHUD.ps1 Install.ps1 Uninstall.ps1 tests .github/workflows/ci.yml

      - name: Commit core hardening
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CodexSessionHealthHUD.cs RendererHudBridge.cs HudStateStore.cs Launch-CodexWithSessionHealthHUD.ps1 Install.ps1 Uninstall.ps1 tests .github/workflows/ci.yml
          git commit -m "Harden host lifecycle and install safety"
          git push
