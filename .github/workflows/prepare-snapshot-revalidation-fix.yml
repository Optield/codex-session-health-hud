name: prepare snapshot revalidation fix

on:
  push:
    paths:
      - .github/workflows/prepare-snapshot-revalidation-fix.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply focused reconciliation fix and regression tests
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import re

          renderer = Path('RendererHudScript.js')
          text = renderer.read_text(encoding='utf-8')
          ready_pattern = re.compile(
              r"    if \(runtime\.postStatus === 'ready' && runtime\.snapshotCompactionId === latestId &&\n"
              r"\s+runtime\.postTokens >= 0 && runtime\.postWindow > 0\) return;"
          )
          new_ready = "    if (runtime.snapshotCompactionId === latestId &&\n      runtime.postTokens >= 0 && runtime.postWindow > 0) {\n      // `syncing` and `unavailable` are transient validation states. Snapshot validity\n      // comes from matching the latest compaction identity and having a usable payload.\n      runtime.postStatus = 'ready';\n      runtime.captureRunId = '';\n      return;\n    }"
          text, replacements = ready_pattern.subn(new_ready, text, count=1)
          if replacements != 1:
              raise SystemExit(f'expected one ready reconciliation condition, replaced {replacements}')

          old_hook = "      effectiveRisk,\n      formatCapturedAt,"
          new_hook = "      effectiveRisk,\n      reconcileSnapshotToHistory,\n      formatCapturedAt,"
          if text.count(old_hook) != 1:
              raise SystemExit(f'expected one test-hook block, found {text.count(old_hook)}')
          text = text.replace(old_hook, new_hook, 1)
          renderer.write_text(text, encoding='utf-8')

          tests = Path('tests/renderer-logic.test.js')
          test_text = tests.read_text(encoding='utf-8')
          marker = "assert.equal(t.formatCapturedAt('not-a-date'), '', 'invalid capture time is hidden');\n\n"
          addition = """assert.equal(t.formatCapturedAt('not-a-date'), '', 'invalid capture time is hidden');

          const persistedReadyDuringSync = {
            postStatus: 'syncing',
            snapshotCompactionId: 'compact-1',
            postTokens: 34002,
            postWindow: 258400,
            captureRunId: '',
            capturedAt: capturedIso
          };
          t.reconcileSnapshotToHistory(persistedReadyDuringSync, 'compact-1');
          assert.equal(persistedReadyDuringSync.postStatus, 'ready', 'matching persisted snapshot survives transient syncing state');
          assert.equal(persistedReadyDuringSync.postTokens, 34002, 'matching persisted snapshot keeps captured tokens');
          assert.equal(persistedReadyDuringSync.postWindow, 258400, 'matching persisted snapshot keeps captured window');
          assert.equal(persistedReadyDuringSync.capturedAt, capturedIso, 'matching persisted snapshot keeps capture time');

          const mismatchedPersistedSnapshot = {
            postStatus: 'syncing',
            snapshotCompactionId: 'compact-1',
            postTokens: 34002,
            postWindow: 258400,
            captureRunId: '',
            capturedAt: capturedIso
          };
          t.reconcileSnapshotToHistory(mismatchedPersistedSnapshot, 'compact-2');
          assert.equal(mismatchedPersistedSnapshot.postStatus, 'notCaptured', 'different latest compaction invalidates an old snapshot');
          assert.equal(mismatchedPersistedSnapshot.snapshotCompactionId, 'compact-2');
          assert.equal(mismatchedPersistedSnapshot.postTokens, -1);
          assert.equal(mismatchedPersistedSnapshot.postWindow, -1);
          assert.equal(mismatchedPersistedSnapshot.capturedAt, '');

          const activeMeasurement = {
            postStatus: 'measuring',
            snapshotCompactionId: 'compact-3',
            postTokens: -1,
            postWindow: -1,
            captureRunId: 'test-run',
            capturedAt: ''
          };
          t.reconcileSnapshotToHistory(activeMeasurement, 'compact-3');
          assert.equal(activeMeasurement.postStatus, 'measuring', 'current-run measurement remains armed during reconciliation');

          """
          if test_text.count(marker) != 1:
              raise SystemExit(f'expected one renderer test insertion point, found {test_text.count(marker)}')
          test_text = test_text.replace(marker, addition, 1)
          tests.write_text(test_text, encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          change_text = changelog.read_text(encoding='utf-8')
          heading = "# Changelog\n\n"
          entry = "# Changelog\n\n## Unreleased\n\n- Preserve valid post-compaction snapshots while thread history is revalidated after thread switches, renderer reloads, or Codex restarts; transient `Syncing` state no longer causes a matching captured snapshot to be discarded as `Not captured`.\n\n"
          if not change_text.startswith(heading):
              raise SystemExit('unexpected changelog header')
          if '## Unreleased' not in change_text:
              change_text = entry + change_text[len(heading):]
          changelog.write_text(change_text, encoding='utf-8')
          '@ | Set-Content -LiteralPath "$env:RUNNER_TEMP\patch.py" -Encoding utf8
          python "$env:RUNNER_TEMP\patch.py"

      - name: Check renderer syntax
        shell: pwsh
        run: node --check .\RendererHudScript.js

      - name: Test renderer logic
        shell: pwsh
        run: node .\tests\renderer-logic.test.js

      - name: Build and run self-tests
        shell: pwsh
        run: .\Build.ps1

      - name: Create Windows package
        shell: pwsh
        run: .\Package.ps1 -OutputDir .\dist

      - name: Test Windows package
        shell: pwsh
        run: .\tests\package-layout.test.ps1 -PackagePath .\dist\CodexSessionHealthHUD-win-x64.zip

      - name: Verify diff
        shell: pwsh
        run: |
          git diff --check
          git diff -- RendererHudScript.js tests/renderer-logic.test.js CHANGELOG.md

      - name: Commit fix
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RendererHudScript.js tests/renderer-logic.test.js CHANGELOG.md
          git commit -m "Preserve captured snapshots during revalidation"
          git push
