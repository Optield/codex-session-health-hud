name: cleanup superseded v0.1.4 release

on:
  push:
    paths:
      - .github/workflows/cleanup-v0.1.4-release.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Delete v0.1.4 release object but keep tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.1.4 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete v0.1.4 --repo "$GITHUB_REPOSITORY" --yes
          fi

      - name: Verify latest release and preserved tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view v0.1.5 --repo "$GITHUB_REPOSITORY" >/dev/null
          ! gh release view v0.1.4 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1
          git ls-remote --exit-code --tags origin refs/tags/v0.1.4 >/dev/null
          git ls-remote --exit-code --tags origin refs/tags/v0.1.5 >/dev/null
