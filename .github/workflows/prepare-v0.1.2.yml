name: prepare-v0.1.2

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/prepare-v0.1.2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v0.1.2 changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected text not found in {path}: {old[:120]!r}')
              text = text.replace(old, new, 1)
              p.write_text(text, encoding='utf-8')

          replace_once(
              'RendererHudScript.js',
              "  function formatPercent(value) {\n    return Number.isFinite(value) ? `${value.toFixed(1)}%` : '—';\n  }\n\n",
              "  function formatPercent(value) {\n    return Number.isFinite(value) ? `${value.toFixed(1)}%` : '—';\n  }\n\n  function formatCapturedAt(value) {\n    if (typeof value !== 'string' || !value) return '';\n    const date = new Date(value);\n    if (!Number.isFinite(date.getTime())) return '';\n    const pad = part => String(part).padStart(2, '0');\n    return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())} ${pad(date.getHours())}:${pad(date.getMinutes())}`;\n  }\n\n"
          )

          replace_once(
              'RendererHudScript.js',
              "          <div data-r-post style=\"margin-top:2px;font-variant-numeric:tabular-nums\">—</div>\n          <div data-r-message style=\"margin-top:3px;opacity:.78\"></div>",
              "          <div data-r-post style=\"margin-top:2px;font-variant-numeric:tabular-nums\">—</div>\n          <div data-r-captured style=\"display:none;margin-top:2px;opacity:.58;font-variant-numeric:tabular-nums\"></div>\n          <div data-r-message style=\"margin-top:3px;opacity:.78\"></div>"
          )

          replace_once(
              'RendererHudScript.js',
              "    const post = tooltip.querySelector('[data-r-post]');\n    const message = tooltip.querySelector('[data-r-message]');",
              "    const post = tooltip.querySelector('[data-r-post]');\n    const captured = tooltip.querySelector('[data-r-captured]');\n    const message = tooltip.querySelector('[data-r-message]');"
          )

          replace_once(
              'RendererHudScript.js',
              "    } else {\n      post.textContent = '—';\n    }\n    message.textContent = risk.message;",
              "    } else {\n      post.textContent = '—';\n    }\n    const capturedAt = runtime && (risk.status === 'ready' || risk.status === 'staleWindow')\n      ? formatCapturedAt(runtime.capturedAt)\n      : '';\n    captured.textContent = capturedAt ? `Captured ${capturedAt}` : '';\n    captured.style.display = capturedAt ? 'block' : 'none';\n    message.textContent = risk.message;"
          )

          replace_once(
              'RendererHudScript.js',
              "      effectiveRisk,\n      isApproximateWindow,",
              "      effectiveRisk,\n      formatCapturedAt,\n      isApproximateWindow,"
          )

          replace_once(
              'tests/renderer-logic.test.js',
              "assert.equal(readyRisk(40, 200).status, 'staleWindow');\n\n",
              "assert.equal(readyRisk(40, 200).status, 'staleWindow');\n\nconst capturedIso = '2026-09-07T07:40:22.000Z';\nconst capturedDate = new Date(capturedIso);\nconst padCaptured = value => String(value).padStart(2, '0');\nconst expectedCaptured = `${capturedDate.getFullYear()}-${padCaptured(capturedDate.getMonth() + 1)}-${padCaptured(capturedDate.getDate())} ${padCaptured(capturedDate.getHours())}:${padCaptured(capturedDate.getMinutes())}`;\nassert.equal(t.formatCapturedAt(capturedIso), expectedCaptured, 'capture time is formatted in local YYYY-MM-DD HH:mm');\nassert.equal(t.formatCapturedAt('not-a-date'), '', 'invalid capture time is hidden');\n\n"
          )

          replace_once(
              'README.md',
              "Post-compaction context\n103K / 258K   39.9%\nThis session is in good shape.",
              "Post-compaction context\n103K / 258K   39.9%\nCaptured 2026-09-07 16:40\nThis session is in good shape."
          )
          replace_once(
              'README.md',
              "```\n\nThe risk bar is intentionally based on **post-compaction context**, not current context.",
              "```\n\nThe `Captured` line uses the local system time and is refreshed whenever a new trustworthy post-compaction snapshot is accepted. If two compactions happen to produce the same percentage, the timestamp makes it easy to confirm that the value was measured again rather than left stale.\n\nThe risk bar is intentionally based on **post-compaction context**, not current context."
          )

          replace_once(
              'README.ko.md',
              "Post-compaction context\n103K / 258K   39.9%\nThis session is in good shape.",
              "Post-compaction context\n103K / 258K   39.9%\nCaptured 2026-09-07 16:40\nThis session is in good shape."
          )
          replace_once(
              'README.ko.md',
              "```\n\nRisk bar는 **현재 context가 아니라 마지막 post-compaction context**를 기준으로 합니다.",
              "```\n\n`Captured` 줄은 Windows의 로컬 시간을 사용하며 신뢰할 수 있는 새 post-compaction snapshot이 확정될 때마다 갱신됩니다. 연속된 컴팩션에서 같은 퍼센트가 나오더라도 캡처 시각을 보면 이전 값이 고정된 것이 아니라 다시 측정된 값인지 바로 확인할 수 있습니다.\n\nRisk bar는 **현재 context가 아니라 마지막 post-compaction context**를 기준으로 합니다."
          )

          p = Path('CHANGELOG.md')
          changelog = p.read_text(encoding='utf-8')
          heading = '# Changelog\n\n'
          if not changelog.startswith(heading):
              raise SystemExit('Unexpected CHANGELOG.md header')
          entry = (
              '## 0.1.2 - 2026-09-07\n\n'
              '- Show the local capture date and time directly under the post-compaction value in the Risk tooltip, making repeated identical percentages verifiably fresh without adding history UI or new persistent state.\n\n'
          )
          p.write_text(heading + entry + changelog[len(heading):], encoding='utf-8')

          notes = Path('.github/release-notes/v0.1.2.md')
          notes.parent.mkdir(parents=True, exist_ok=True)
          notes_text = (
              '# Codex Session Health HUD v0.1.2\n\n'
              'A small usability update focused on making post-compaction measurements easier to verify.\n\n'
              '## What\'s new\n\n'
              '- The Risk tooltip now shows `Captured YYYY-MM-DD HH:mm` directly below the post-compaction context value.\n'
              '- The timestamp uses the local system time and updates whenever a new trustworthy post-compaction snapshot is accepted.\n'
              '- Repeated identical percentages can now be distinguished from a stale value without adding compaction history or changing the state-file schema.\n\n'
              '## Install / update\n\n'
              '1. Download `CodexSessionHealthHUD-win-x64.zip` from the release **Assets**.\n'
              '2. Close Codex completely.\n'
              '3. Extract the ZIP and double-click `Install-Easy.bat`.\n'
              '4. Start Codex using **`Codex with Session Health HUD`** from the Windows Start menu.\n'
              '5. After installation, the downloaded ZIP and extracted folder can be deleted.\n\n'
              'Existing `%LOCALAPPDATA%\\CodexSessionHealthHUD\\state.json` data is preserved by the installer.\n'
          )
          notes.write_text(notes_text, encoding='utf-8')
          PY

      - name: Commit v0.1.2 changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RendererHudScript.js tests/renderer-logic.test.js README.md README.ko.md CHANGELOG.md .github/release-notes/v0.1.2.md
          git commit -m 'Show post-compaction capture time'
          git push origin HEAD:main
