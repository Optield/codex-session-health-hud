name: update Windows security README guidance

on:
  push:
    paths:
      - .github/workflows/update-windows-security-readme.yml

permissions:
  contents: write

jobs:
  update-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update English and Korean README guidance
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, marker, replacement):
              text = path.read_text(encoding='utf-8')
              count = text.count(marker)
              if count != 1:
                  raise SystemExit(f'{path}: expected marker once, found {count}')
              path.write_text(text.replace(marker, replacement, 1), encoding='utf-8')

          en = Path('README.md')
          en_marker = """`Install-Easy.bat` installs only the files already present in that ZIP. It does **not** download code, use PowerShell `-EncodedCommand`, disable Microsoft Defender, or add antivirus exclusions.
"""
          en_insert = en_marker + """
#### Windows security prompts on first run

Because the HUD executable is distributed directly from GitHub and is not currently code-signed, Windows may perform a Microsoft Defender SmartScreen reputation check the first time a newly downloaded version is run. SmartScreen evaluates publisher reputation and the reputation of the specific file hash, so a newly built unsigned release can be checked or warned about again even if you used an earlier version without a prompt. **A SmartScreen reputation check or an “unrecognized app” warning by itself is not the same thing as a malware detection.** Continue only after confirming that you downloaded `CodexSessionHealthHUD-win-x64.zip` from this repository's official GitHub Release **Assets**. If Microsoft Defender explicitly identifies malware or quarantines the file, do not bypass that detection; stop and report it.

On some systems, Windows may also show **`Open File - Security Warning`** with **`Publisher: Unknown Publisher`**. If that dialog includes **`Always ask before opening this file`**, clear (uncheck) that box before choosing **`Run`** if you do not want the same prompt every time you launch that specific file. The checkbox means Windows should keep asking before opening that file, so clearing it is the convenient choice for a file you have already verified. This is a per-file setting, so a newly downloaded HUD release may prompt again. You do not need to disable Microsoft Defender or add an antivirus exclusion.
"""
          replace_once(en, en_marker, en_insert)

          ko = Path('README.ko.md')
          ko_marker = """`Install-Easy.bat`은 ZIP 안에 이미 들어 있는 로컬 파일만 설치합니다. 코드 다운로드, PowerShell `-EncodedCommand`, Microsoft Defender 비활성화, 백신 예외 추가를 하지 않습니다.
"""
          ko_insert = ko_marker + """
#### 최초 실행 시 Windows 보안 확인

HUD 실행 파일은 GitHub Release에서 직접 배포하며 현재 코드 서명을 하지 않았기 때문에, 새 버전을 처음 실행할 때 Windows가 Microsoft Defender SmartScreen 평판 확인을 수행하거나 잠시 검사/경고 화면을 보여줄 수 있습니다. SmartScreen은 게시자 신뢰도와 **해당 파일 해시 자체의 평판**을 함께 사용하므로, 이전 버전을 문제없이 사용했더라도 새로 빌드된 서명되지 않은 실행 파일은 새 버전마다 다시 확인될 수 있습니다. **SmartScreen의 평판 확인이나 “인식할 수 없는 앱” 경고 자체는 악성코드가 탐지됐다는 뜻과는 다릅니다.** 반드시 이 저장소의 공식 GitHub Release **Assets**에서 `CodexSessionHealthHUD-win-x64.zip`을 받은 것이 맞는지 확인한 뒤 진행하세요. Microsoft Defender가 실제로 악성코드를 탐지했거나 파일을 격리했다고 명시한다면 그 탐지를 우회하지 말고 실행을 중단한 뒤 이슈로 알려주세요.

일부 Windows에서는 **`파일 열기 - 보안 경고`** 창에 **`게시자: 알 수 없는 게시자`**가 표시될 수 있습니다. 창 아래에 **`이 파일을 열기 전에 항상 확인(W)`** 체크박스가 있다면, 같은 실행 파일을 열 때마다 이 창을 다시 보지 않으려면 **체크를 해제한 뒤 `실행(R)`**을 누르세요. 이 체크박스는 “이 파일을 열기 전에 계속 확인할지”를 뜻하므로, 출처를 이미 확인한 파일을 편하게 사용하려면 **해제하는 것이 맞습니다.** 이 설정은 해당 파일에만 적용되므로 새 버전을 다시 다운로드하면 경고가 다시 나타날 수 있습니다. Microsoft Defender를 끄거나 백신 예외를 추가할 필요는 없습니다.
"""
          replace_once(ko, ko_marker, ko_insert)
          PY

      - name: Verify documentation
        shell: bash
        run: |
          grep -F "Always ask before opening this file" README.md
          grep -F "이 파일을 열기 전에 항상 확인(W)" README.ko.md
          grep -F "do not bypass that detection" README.md
          grep -F "그 탐지를 우회하지 말고" README.ko.md
          git diff --check
          git diff -- README.md README.ko.md

      - name: Commit documentation update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.ko.md
          git commit -m "Document first-run Windows security prompts"
          git push
