name: execute session token removal

on:
  push:
    paths:
      - .github/workflows/execute-session-token-removal.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply session-token removal
        shell: pwsh
        run: python .\scripts\remove-session-tokens-once.py

      - name: Verify Session tokens are gone from product code and READMEs
        shell: pwsh
        run: |
          $codeMatches = Select-String -Path 'RendererHudScript.js','tests/renderer-logic.test.js' -Pattern 'sessionTotalTokens|sessionTotal|data-r-total|Session tokens'
          if ($codeMatches) { $codeMatches | ForEach-Object { Write-Host $_ }; exit 1 }
          $readmeMatches = Select-String -Path 'README.md','README.ko.md' -Pattern 'Session tokens|cumulative session tokens|total\.totalTokens|세션 누적 토큰|누적 token 사용량|cumulative token/session'
          if ($readmeMatches) { $readmeMatches | ForEach-Object { Write-Host $_ }; exit 1 }

      - name: Check renderer syntax
        shell: pwsh
        run: node --check .\RendererHudScript.js

      - name: Test renderer logic
        shell: pwsh
        run: node .\tests\renderer-logic.test.js

      - name: Build and run self-tests
        shell: pwsh
        run: .\Build.ps1

      - name: Create Windows package
        shell: pwsh
        run: .\Package.ps1 -OutputDir .\dist

      - name: Test Windows package
        shell: pwsh
        run: .\tests\package-layout.test.ps1 -PackagePath .\dist\CodexSessionHealthHUD-win-x64.zip

      - name: Verify diff
        shell: pwsh
        run: |
          git diff --check
          git diff -- RendererHudScript.js tests/renderer-logic.test.js README.md README.ko.md CHANGELOG.md

      - name: Commit removal
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RendererHudScript.js tests/renderer-logic.test.js README.md README.ko.md CHANGELOG.md
          git commit -m "Remove session token telemetry"
          git push
