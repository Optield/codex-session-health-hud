name: ci

on:
  push:
  pull_request:

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check renderer syntax
        shell: pwsh
        run: node --check .\RendererHudScript.js
      - name: Test renderer logic
        shell: pwsh
        run: node .\tests\renderer-logic.test.js
      - name: Build and run self-tests
        shell: pwsh
        run: .\Build.ps1
      - name: Create Windows package
        shell: pwsh
        run: .\Package.ps1 -OutputDir .\dist
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: CodexSessionHealthHUD-win-x64
          path: .\dist\CodexSessionHealthHUD-win-x64.zip
          if-no-files-found: error
