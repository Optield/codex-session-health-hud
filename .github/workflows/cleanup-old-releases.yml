name: cleanup old releases

on:
  push:
    paths:
      - .github/workflows/cleanup-old-releases.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Delete superseded release objects but keep tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for tag in v0.1.1 v0.1.2; do
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes
            fi
          done

      - name: Verify latest release remains and old tags are preserved
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view v0.1.3 --repo "$GITHUB_REPOSITORY" >/dev/null
          ! gh release view v0.1.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1
          ! gh release view v0.1.2 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1
          git ls-remote --exit-code --tags origin refs/tags/v0.1.1 >/dev/null
          git ls-remote --exit-code --tags origin refs/tags/v0.1.2 >/dev/null
